# ============================================================
# CLI2IM Configuration
# ============================================================
# Copy this file to ~/.cli2im/config.yaml and edit.
#
# Secrets: use ${ENV_VAR} syntax to reference environment variables
# instead of hardcoding tokens. Set them in your shell profile,
# .env file, or LaunchAgent plist EnvironmentVariables.
# Protect the config/data directory; do not commit expanded credentials.
# ============================================================

# Optional; omitted by default. Follow the current macOS system HTTP/HTTPS proxy.
# With required: true, all bots stop whenever that proxy is off, so leave this out
# when the proxy runs in TUN mode without a system proxy.
# Linux/Windows: use mode: environment and configure HTTP_PROXY/HTTPS_PROXY.
# Requires Node.js 24.14+ (24 LTS) or 25.4+. This is not an OS firewall or DNS leak test.
# network:
#   mode: system
#   required: true
#   noProxy: [127.0.0.1, localhost, "::1"]  # required mode permits local exceptions only

# Explicit long-term memory; omitted by default. Enable per bot with memory: true.
# memory:
#   dir: ~/.cli2im/memory           # private bridge storage; never grant to agents
#   people:                        # optional explicit private-memory sharing
#     alice: ["feishu:ccbot:ou_xxxxxxxxxxxx", "feishu:codexbot:ou_xxxxxxxxxxxx"]
#     # Format: <platform>:<botName>:<userId>; bot must exist on that platform.
#     # Telegram example (requires a configured Telegram bot): telegram:mytg:123456789
#     # Group memory remains per group, including its topics.

# ----------------------------------------------------------
# Bots — each bot binds one agent to one IM platform.
# You can define as many bots as you need.
# ----------------------------------------------------------
bots:
  # --- Example: Claude Code on Feishu ---
  ccbot:
    enabled: true                  # false keeps config/history but stops this bot
    agent: claude-code              # must match a key in `agents` below
    platform: feishu
    feishu:
      appId: ${CCBOT_FEISHU_APP_ID}       # Feishu Open Platform → App ID
      appSecret: ${CCBOT_FEISHU_APP_SECRET}
    workingDirectory: ~/projects    # default cwd for agent subprocess
    allowFrom:                      # user IDs allowed to use this bot
      - ou_xxxxxxxxxxxx             # Feishu open_id; use the platform's user management
    adminUsers:                    # owner/operator IDs; do not put ordinary users here
      - ou_xxxxxxxxxxxx
    allowPublic: false             # '*' alone never enables public access
    requireMention: true
    groupPolicy: allowlist          # a listed user must also use an allowed group
    groupAllowFrom: []              # empty: private chats only; add exact group IDs if needed
    debounceMs: 800                 # combine same-sender/same-topic bursts; 0 disables
    projects:
      default: ~/projects          # /projects default; each path is checked again on use
    shortcuts:
      progress:
        description: 查看项目进展
        prompt: 请检查当前项目，简要说明进展和下一步，不修改文件。
    speech:
      stt: true                    # DashScope receives incoming audio for transcription
      tts: false                   # false: do not send reply text for voice synthesis
    # sessionRoots: [~/projects/shared]  # explicitly SHARE these existing desktop histories
                                        # ordinary users otherwise see only this chat/topic's bound sessions
    permissionMode: blacklist       # bypass = skip all tool approval
                                    # blacklist = block dangerous commands (default)
    # --- Optional fields ---
    # autoApprove: false            # true = auto-approve all tool requests
    # turnTimeoutMs: 600000         # hard cap N ms after process START (not per-turn, never reset — can kill healthy long sessions); unset = no cap
    # idleTimeoutMs: 300000         # stop a stalled process; tasks are not automatically re-executed
    # larkCliConfigDir: ~/.lark-cli/  # path to lark-cli config (for lark-cli skills)
    # agentsFile: AGENTS.md         # per-bot runtime instructions read every conversation.
                                    #   Relative paths resolve against workingDirectory; ~ is expanded.
                                    #   Defaults to AGENTS.md in workingDirectory when present.
                                    #   claude-code: appended to the system prompt (every turn).
                                    #   codex/gemini: place AGENTS.md/GEMINI.md in workingDirectory (read natively).
                                    #   Must be a regular file (symlinks/FIFOs are ignored) under 256 KB.
                                    #   Set to false to disable the default lookup.
    # userOverrides:                # per-user overrides
    #   ou_xxxxxxxxxxxx:
    #     workingDirectory: ~/user-a-projects
    # --- Shared bot isolation (macOS; claude-code or codex only) ---
    # Merge these fields into this bot, replacing workingDirectory/projects above
    # and the userOverrides example. Use separate, non-overlapping paths per bot/user.
    # workingDirectory: /Users/YourName/bot-work/ccbot/groups
    # projects: { default: /Users/YourName/bot-work/ccbot/groups }
    # userOverrides:                # EVERY allowFrom or adminUsers user needs a workspace
    #   ou_xxxxxxxxxxxx:
    #     workingDirectory: /Users/YourName/bot-work/ccbot/alice
    # memory: true                  # optional; requires isolation.enabled: true
    # isolation:
    #   enabled: true               # omitted = existing behavior; no isolation
    #   readable: [/Users/YourName/bot-reference]  # absolute, read-only grants
    #   writable: []                # absolute read/write grants; keep outside protected data
    # plugins: [/Users/YourName/bot-plugins/skills-only]  # Claude only, operator-maintained/read-only
    # skills: [example-skill]        # optional Claude skill allowlist
    # agentsFile: false             # no bridge default AGENTS.md lookup in isolation;
    #                               # explicit path must be absolute, outside all bot-writable areas
    # All groups use the bot-level workspace: these groups can see each other's files.
    # Keep allowPublic false; '*' and mcpServers are forbidden, including empty mcpServers.
    # Plugins must contain only skills, without hooks/MCP/agents/commands/LSP definitions.
    # larkCliConfigDir must also be explicitly listed in isolation.writable;
    # this grants that lark-cli account's capabilities. It is never auto-granted.
    # Isolated PATH: absolute entries only, no empty entries or '.'/'..' segments,
    # and no entries inside agent-writable directories. Use CLI login, not provider keys in env.
    # Use an agent binary outside personal CLI state directories (see agents below).
    # Checks run at startup and executable changes; cli2im doctor isolation / IM /doctor
    # reruns them without paid models. No current VERIFIED record means execution is paused.
    # Codex: owner logs in once with CODEX_HOME=<dataDir>/codex-home/<sha256(botName)[:16]>.
    # See README for the hash/login command and tool limits. Disabling isolation restores
    # unrestricted execution; first remove all users other than yourself.
    # relay:                         # bot-to-bot relay (group chats only)
    #   enabled: false               # opt-in: both sender and receiver must enable
    #   allowFromBots: [codexbot]     # exact permitted source bots; never authorizes control commands
    #   maxConsecutiveRounds: 10     # safety cap for bot-to-bot turns without human input

  # --- Example: Codex on Feishu ---
  codexbot:
    enabled: true
    agent: codex
    platform: feishu
    feishu:
      appId: ${CODEXBOT_FEISHU_APP_ID}
      appSecret: ${CODEXBOT_FEISHU_APP_SECRET}
    workingDirectory: ~/projects
    allowFrom:
      - ou_xxxxxxxxxxxx
    adminUsers:
      - ou_xxxxxxxxxxxx
    allowPublic: false
    requireMention: true
    groupPolicy: allowlist
    groupAllowFrom: []
    speech: { stt: true, tts: false }
    permissionMode: blacklist

  # --- Example: Gemini on Telegram ---
  # geminibot:
  #   agent: gemini
  #   platform: telegram
  #   telegram:
  #     token: ${GEMINI_TG_BOT_TOKEN}
  #   workingDirectory: ~/projects
  #   allowFrom:
  #     - "123456789"
  #   permissionMode: bypass            # Gemini CLI has no tool approval flow

  # --- Example: ZCode (GLM-5.2) on Feishu ---
  # zcodebot:
  #   agent: zcode
  #   platform: feishu
  #   feishu:
  #     appId: ${ZCODE_FEISHU_APP_ID}
  #     appSecret: ${ZCODE_FEISHU_APP_SECRET}
  #   workingDirectory: ~/projects
  #   allowFrom:
  #     - ou_xxxxxxxxxxxx
  #   permissionMode: blacklist         # blacklist → build mode → tools ask approval via card buttons
                                        # bypass → yolo mode → no approval prompts at all

  # --- Example: Kimi Work (desktop Work quota, text-only) on Feishu ---
  # kimibot:
  #   agent: kimi-work
  #   platform: feishu
  #   feishu:
  #     appId: ${KIMI_FEISHU_APP_ID}
  #     appSecret: ${KIMI_FEISHU_APP_SECRET}
  #   workingDirectory: ~/projects
  #   allowFrom:
  #     - ou_xxxxxxxxxxxx
  #   permissionMode: blacklist         # default: dangerous tools ask via IM approval
                                        # bypass explicitly auto-allows daemon approvals

# ----------------------------------------------------------
# Agents — CLI binaries that bots can spawn.
# Only define the agents you have installed.
# ----------------------------------------------------------
agents:
  claude-code:
    binary: ~/.claude/local/claude       # path to Claude Code binary
    # Isolation: use a binary outside ~/.claude, e.g. /opt/homebrew/bin/claude,
    # whose resolved installation directory is also outside protected/writable areas.
    # defaultModel: claude-sonnet-4-6    # optional; omit to use CLI default
    env:
      DISABLE_AUTOUPDATER: "1"           # recommended for daemon use

  codex:
    binary: ~/.codex/bin/codex
    # Isolation: likewise use an installation outside ~/.codex, e.g. /opt/homebrew/bin/codex.

  # gemini:
  #   binary: /opt/homebrew/bin/gemini   # or: /usr/local/bin/gemini

  # zcode (GLM-5.2 coding agent). The binary is a .cjs bundle shipped with
  # the ZCode desktop app; it's launched via `node <binary> app-server`,
  # which speaks a JSON-RPC streaming protocol.
  zcode:
    binary: /Applications/ZCode.app/Contents/Resources/glm/zcode.cjs
    # No defaultModel: zcode uses the provider/model in ~/.zcode/cli/config.json
    # (the Z.AI OAuth login). Set it only if you want to override per-bot.
    env:
      # zcode reads its own config; usually nothing extra is needed.
      # Keep PATH so it can find tools it spawns (git, ripgrep, ...).
      PATH: ${PATH}

  # Kimi desktop Work agent. This launches the bundled daimon with its own
  # share/config paths, so it does not contend with the running Kimi desktop
  # instance. k3-agent uses the desktop Work entitlement, not kimi-code CLI.
  # First release is text-only and does not support cross-restart resume.
  # kimi-work:
  #   binary: /Applications/Kimi.app/Contents/Resources/resources/daimon-bundle/bin/kimi-daimon
  #   defaultModel: k3-agent
  #   defaultEffort: low                # low | high | max
  #   env:
  #     KIMI_SHARE_DIR: ~/.cli2im/kimi-work
  #     DAIMON_CONFIG_PATH: ~/.cli2im/kimi-work/config.json
  #     DAIMON_BUNDLE_NODE_BIN: /Applications/Kimi.app/Contents/Resources/resources/runtime/node

# ----------------------------------------------------------
# Session management
# ----------------------------------------------------------
session:
  maxActive: 64                    # max concurrent sessions across all bots
  idleResetMinutes: 120            # auto-cleanup sessions idle longer than this
  dbPath: ~/.cli2im/cli2im.db      # SQLite database path

# ----------------------------------------------------------
# Dangerous command patterns (regex)
# Commands matching these patterns require explicit approval via IM buttons.
# ----------------------------------------------------------
dangerousPatterns:
  - 'rm\s+(-[a-zA-Z]*[rRf][a-zA-Z]*|--force\b|--recursive\b)'
  - 'mkfs\.'
  - 'dd\s+.*of=\/dev\/'
  - 'git\s+push\s+.*--force'
  - 'git\s+reset\s+--hard'
  - 'git\s+clean\s+-[a-zA-Z]*f'
  - 'chmod\s+-[a-zA-Z]*R[a-zA-Z]*\s+777\b'
  - 'curl\s+.*\|\s*(sh|bash)\b'
  - 'kill\s+-9'
  - 'killall'
  - 'pkill'
  - 'sudo\s+'
  - 'shutdown|reboot'
  - '>\s*\/etc\/'
  - 'rm\s+.*\.(env|credentials)'

# ----------------------------------------------------------
# Streaming output — controls how often IM cards/messages update
# ----------------------------------------------------------
streaming:
  intervalMs: 200                  # min ms between card updates (Feishu throttle)
  minDeltaChars: 30                # skip update if fewer chars changed
  highWaterMark: 1048576           # max buffered output bytes (1 MB)

# ----------------------------------------------------------
# HTTP server — used for CLI handoff API and session resume callbacks
# ----------------------------------------------------------
server:
  port: 3900
  host: 127.0.0.1
  token: ${CLI2IM_WEB_TOKEN}       # auth token for handoff API; generate with: openssl rand -hex 32

# ----------------------------------------------------------
# Behavior when user sends a new message while agent is busy
# ----------------------------------------------------------
newMessageBehavior: queue          # queue = hold until agent is free
                                   # interrupt = abort current turn, start new one

notifications:
  codex:
    enabled: false                  # optional; enable and bind an authorized private chat explicitly
    botName: codexbot
    completionSource: structured

# ----------------------------------------------------------
# Content guard — optional content safety filtering
# `content-guard` is an optional peer dependency; filtering is disabled when absent.
# ----------------------------------------------------------
# contentGuard:
#   enabled: true
#   blockThreshold: 15             # detector score threshold; /doctor reports actual load status
